<!doctype html>
<html lang="it">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="Calcolo del tema natale: posizioni planetarie, case e aspetti." />
    <link rel="icon" href="%sveltekit.assets%/favicon.svg" />
    <!--
      L'aspetto scelto va applicato prima che la pagina si disegni: deciderlo
      da un componente vorrebbe dire un lampo chiaro in faccia a chi ha scelto
      lo scuro, a ogni caricamento. Poche righe senza dipendenze, che girano
      mentre il resto del JavaScript deve ancora arrivare; la chiave e
      l'attributo sono quelli di `lib/color-scheme.ts`.
    -->
    <script>
      try {
        const scelta = localStorage.getItem('undicesimacasa:color-scheme');
        if (scelta === 'light' || scelta === 'dark') {
          document.documentElement.setAttribute('data-color-scheme', scelta);
        }
      } catch {
        // Memoria negata: vale l'aspetto di sistema.
      }
    </script>
    %sveltekit.head%
  </head>
  <body data-sveltekit-preload-data="hover">
    <div style="display: contents">%sveltekit.body%</div>
  </body>
</html>
