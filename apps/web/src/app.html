<!doctype html>
<html lang="it">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <!-- La descrizione la dà ogni pagina, con `lib/components/Meta.svelte`: una
         qui sarebbe la prima del documento, e resterebbe quella che i motori di
         ricerca leggono per tutte e cinque le sezioni. -->
    <link rel="icon" href="%sveltekit.assets%/favicon.svg" />
    <!-- Safari vuole un PNG e non guarda l'SVG: senza, il sito aggiunto alla
         schermata iniziale diventa un rettangolo bianco con dentro una
         miniatura della pagina. Lo rasterizza `scripts/build-icons.mjs` dal
         favicon, prima di ogni build. -->
    <link rel="apple-touch-icon" href="%sveltekit.assets%/apple-touch-icon.png" />
    <!-- Il manifesto è una rotta prerenderizzata e non un file in `static/`:
         le scorciatoie che dichiara sono le sezioni del menù, e quell'elenco
         esiste una volta sola in `lib/navigation.ts`. -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <!-- iOS legge il manifesto solo dalla 17.4: sotto, questa è l'unica cosa
         che gli dica di aprire il sito senza la barra degli indirizzi. -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <!--
      Il colore della barra del browser su mobile, che va scelto due volte
      perché la pagina ha due fondi: dichiararne uno solo lascia una striscia
      chiara sopra una pagina scura, o il contrario. Sono i due valori di
      `--sfondo`, che qui non si possono leggere — questo tag è testo, non CSS.
    -->
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#faf8f4" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#1a1917" />
    <!--
      L'aspetto scelto va applicato prima che la pagina si disegni: deciderlo
      da un componente vorrebbe dire un lampo chiaro in faccia a chi ha scelto
      lo scuro, a ogni caricamento. Poche righe senza dipendenze, che girano
      mentre il resto del JavaScript deve ancora arrivare; la chiave e
      l'attributo sono quelli di `lib/color-scheme.ts`.
    -->
    <script>
      try {
        const scelta = localStorage.getItem('dodicisegni:color-scheme');
        if (scelta === 'light' || scelta === 'dark') {
          document.documentElement.setAttribute('data-color-scheme', scelta);
        }
      } catch {
        // Memoria negata: vale l'aspetto di sistema.
      }
    </script>
    %sveltekit.head%
  </head>
  <body data-sveltekit-preload-data="hover">
    <div style="display: contents">%sveltekit.body%</div>
  </body>
</html>
