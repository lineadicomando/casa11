<?xml version="1.0" encoding="UTF-8"?>
<!--
  Il monogramma: il numero romano undici dentro il riquadro del marchio.

  È costruito, non disegnato: due diagonali e un'asta, tutte e tre larghe 5,6
  su una griglia di 64, coi terminali tagliati netti. La larghezza vale 1,61
  nelle unità del marchio, cioè quanto l'asta della «i» di Jost a 19,29 — il
  segno pesa come le lettere che gli stanno accanto.

  La X e la I arrivano entrambe da 17,5 a 46,5. Le diagonali partono da 19,2 e
  44,8 perché il taglio netto di un tratto obliquo sporge oltre il suo estremo:
  è quello sporgere che le porta in pari con l'asta.

  Il riquadro serve nel tema chiaro: l'oro sul fondo crema sta a 1,73:1, contro
  il 3:1 che WCAG chiede a un oggetto grafico; sul riquadro scuro sta a 9,58:1.
  Nel tema scuro il fondo della pagina fa già quel lavoro e il riquadro sparisce
  — vedi `header_dark.svg`.
-->
<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64">
  <rect width="64" height="64" rx="9.7" fill="#1a1917"/>
  <g fill="none" stroke="#fab219" stroke-width="5.6">
    <path d="M16.8 19.2 36.4 44.8M36.4 19.2 16.8 44.8"/>
    <path d="M46.6 17.5V46.5"/>
  </g>
</svg>
